<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050506" />
  <title>你都不心領</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="menu-on">
    <div id="stage">
      <div id="bg" class="layer"></div>
      <div id="bg-dim" class="layer"></div>
      <div id="sprites" class="layer">
        <img id="sprite" alt="" hidden />
      </div>

      <header id="hud" hidden>
        <div id="chapter"></div>
        <nav id="quick">
          <button type="button" data-audio="bgm">音樂　開</button>
          <button type="button" data-audio="se">音效　開</button>
          <button type="button" data-act="log">回想</button>
          <button type="button" data-act="auto" id="btn-auto">自動</button>
          <button type="button" data-act="skip" id="btn-skip">快進</button>
          <button type="button" data-act="save">存檔</button>
          <button type="button" data-act="title">標題</button>
        </nav>
      </header>

      <div id="choices" hidden></div>

      <div id="textbox" hidden>
        <div id="nameplate" hidden></div>
        <p id="line"></p>
        <div id="clicker" hidden>▼</div>
      </div>

      <section id="title" class="screen title-screen">
        <div class="title-copy">
          <p class="kicker">從一開始就站在你這一邊</p>
          <h1>
            <span class="t1">你都</span>
            <span class="t2">不心領</span>
          </h1>
          <p class="sub">天主教國立輔仁大學<br />應用美術學系</p>
        </div>
        <div class="title-actions">
          <button type="button" id="btn-start">開始</button>
          <button type="button" id="btn-continue">繼續</button>
          <button type="button" id="btn-about">關於</button>
          <div class="audio-row">
            <button type="button" data-audio="bgm">音樂　開</button>
            <button type="button" data-audio="se">音效　開</button>
          </div>
        </div>
      </section>

      <section id="about" class="screen" hidden>
        <div class="panel">
          <h2>關於</h2>
          <p>玩家是劉赫。我們只下指示，願望由你走完。</p>
          <p>標題取自他寫過的那句：從一開始就站在你這一邊，你都不心領。</p>
          <p>對白來自原文：鄰座「嗯」、重逢「好久不見」、網遊隊友、展後捷運上的模糊告白。個人線尚未實裝。</p>
          <p>若一路不心領，阿龍陳會說「時間差不多了」。</p>
          <button type="button" id="btn-about-back">返回</button>
        </div>
      </section>

      <section id="log" class="screen" hidden>
        <div class="panel log-panel">
          <h2>回想</h2>
          <div id="log-body"></div>
          <button type="button" id="btn-log-close">關閉</button>
        </div>
      </section>

      <section id="toast" hidden></section>
    </div>
  </div>
  <script src="js/script.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/assets-bg.js"></script>
  <script src="js/assets-chara.js"></script>
</body>
</html>
