<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050506" />
  <title>劉赫 · DEMO</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <div id="bg" class="layer"></div>
      <div id="bg-dim" class="layer"></div>
      <div id="sprites" class="layer">
        <img id="sprite" alt="" hidden />
      </div>
      <div id="flash" class="layer"></div>

      <header id="hud">
        <div id="chapter"></div>
        <nav id="quick">
          <button type="button" data-audio="bgm">音樂　開</button>
          <button type="button" data-audio="se">音效　開</button>
          <button type="button" data-act="log">回想</button>
          <button type="button" data-act="auto" id="btn-auto">自動</button>
          <button type="button" data-act="skip" id="btn-skip">快進</button>
          <button type="button" data-act="save">存檔</button>
          <button type="button" data-act="title">標題</button>
        </nav>
      </header>

      <div id="choices" hidden></div>

      <div id="textbox">
        <div id="nameplate" hidden></div>
        <p id="line"></p>
        <div id="clicker" hidden>▼</div>
      </div>
    </div>

    <section id="title" class="screen">
      <div class="title-inner">
        <p class="kicker">我們是指示劉赫實現願望的工具</p>
        <h1>劉赫</h1>
        <p class="sub">天主教國立輔仁大學　應用美術學系 · DEMO</p>
        <div class="title-actions">
          <button type="button" id="btn-start">開始指示</button>
          <button type="button" id="btn-continue">繼續</button>
          <button type="button" id="btn-about">關於</button>
          <div class="audio-row">
            <button type="button" data-audio="bgm">音樂　開</button>
            <button type="button" data-audio="se">音效　開</button>
          </div>
        </div>
        <p class="hint">點畫面前進　選項出現時點其中一句</p>
      </div>
    </section>

    <section id="about" class="screen" hidden>
      <div class="panel">
        <h2>關於這份 demo</h2>
        <p>玩家是劉赫。我們只下指示，願望由你走完。</p>
        <p>對白與事件只使用他寫過的原文：鄰座「嗯」、重逢「好久不見」、網遊隊友、展後捷運上的模糊告白。個人線、成人場景、阿龍陳完整結局尚未實裝。</p>
        <p>若一路不心領，阿龍陳會在最後出現，說那句「時間差不多了」。</p>
        <button type="button" id="btn-about-back">返回</button>
      </div>
    </section>

    <section id="log" class="screen" hidden>
      <div class="panel log-panel">
        <h2>回想</h2>
        <div id="log-body"></div>
        <button type="button" id="btn-log-close">關閉</button>
      </div>
    </section>

    <section id="toast" hidden></section>
  </div>
  <script src="js/assets-bg.js"></script>
  <script src="js/assets-chara.js"></script>
  <script src="js/script.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
